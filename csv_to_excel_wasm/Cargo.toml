[package]
name = "csv_to_excel_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
calamine = "0.26.1"
rust_xlsxwriter = "0.80.0"
csv = "1.3.1"
 napi = { version = "2", features = ["async"] }
napi-derive = "2"
tokio = "1.43.0"
napi-build = "1"

[build-dependencies]
napi-build = "1"
