[package]
edition = "2021"
name = "example1"
version = "0.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
csv = "1.3.1"
# Default enable napi4 feature, see https://nodejs.org/api/n-api.html#node-api-version-matrix
napi = { version = "2.12.2", default-features = false, features = ["napi4"] }
napi-derive = "2.12.2"
rust_xlsxwriter = "0.80.0"

[build-dependencies]
napi-build = "2.0.1"

[profile.release]
lto = true
strip = "symbols"
